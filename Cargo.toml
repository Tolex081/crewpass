[workspace]
resolver = "2"
members = ["contract", "test-receiver", "pass-account", "contract-v2", "test-target"]

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package]
name = "test-target"
description = "Test-only contract for CrewPass V2 sandbox tests: a slow call chain, a failing method, and a hostile nft_transfer_call receiver. Never deployed."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/Tolex081/crewpass"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
